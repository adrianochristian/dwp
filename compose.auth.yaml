services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME outside Git}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD outside Git}
      PROVIDER_A_CLIENT_SECRET: ${PROVIDER_A_CLIENT_SECRET:?Set PROVIDER_A_CLIENT_SECRET outside Git}
      PROVIDER_B_CLIENT_SECRET: ${PROVIDER_B_CLIENT_SECRET:?Set PROVIDER_B_CLIENT_SECRET outside Git}
      OPERATOR_CLIENT_SECRET: ${OPERATOR_CLIENT_SECRET:?Set OPERATOR_CLIENT_SECRET outside Git}
      KC_HOSTNAME: http://127.0.0.1:${KEYCLOAK_PORT:-8080}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./config/keycloak/dwp-realm.json:/opt/keycloak/data/import/dwp-realm.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r response <&3
          [[ "$$response" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30
